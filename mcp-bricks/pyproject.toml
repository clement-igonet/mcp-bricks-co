[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-bricks-co"
version = "1.0.0"
description = "MCP server for bricks.co API"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.9.0",
    "httpx>=0.27.0",
]

[project.scripts]
mcp-bricks = "mcp_bricks.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_bricks"]
